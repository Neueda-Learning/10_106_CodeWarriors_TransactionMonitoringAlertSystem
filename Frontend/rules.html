<section id="rules-content" class="view-section">
    <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1">Rules Management</h2>
            <p class="text-muted mb-0">Manage monitoring rules used to detect suspicious transactions.</p>
        </div>
        <button id="add-rule-btn" type="button" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Rule
        </button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
            <button type="button" class="card shadow-sm border-primary h-100 text-start rules-stat-card" data-stat-filter="ALL">
                <div class="card-body">
                    <h6 class="card-title text-muted text-uppercase mb-2">Total Rules</h6>
                    <h3 id="stat-total-rules" class="card-text fw-bold text-primary mb-0">0</h3>
                </div>
            </button>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
            <button type="button" class="card shadow-sm border-success h-100 text-start rules-stat-card" data-stat-filter="ACTIVE">
                <div class="card-body">
                    <h6 class="card-title text-muted text-uppercase mb-2">Active Rules</h6>
                    <h3 id="stat-active-rules" class="card-text fw-bold text-success mb-0">0</h3>
                </div>
            </button>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
            <button type="button" class="card shadow-sm border-secondary h-100 text-start rules-stat-card" data-stat-filter="INACTIVE">
                <div class="card-body">
                    <h6 class="card-title text-muted text-uppercase mb-2">Disabled Rules</h6>
                    <h3 id="stat-disabled-rules" class="card-text fw-bold text-secondary mb-0">0</h3>
                </div>
            </button>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
            <button type="button" class="card shadow-sm border-warning h-100 text-start rules-stat-card" data-stat-filter="RESET">
                <div class="card-body">
                    <h6 class="card-title text-muted text-uppercase mb-2">Rule Types</h6>
                    <h3 id="stat-rule-types" class="card-text fw-bold text-warning mb-0">0</h3>
                </div>
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-6 col-lg-3">
                    <label for="rule-search" class="form-label">Search Rule</label>
                    <input id="rule-search" type="text" class="form-control" placeholder="Search by name or ID...">
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <label for="rule-type-filter" class="form-label">Rule Type</label>
                    <select id="rule-type-filter" class="form-select">
                        <option value="ALL">All Types</option>
                        <option value="Amount Threshold">Amount Threshold</option>
                        <option value="Velocity Rule">Velocity Rule</option>
                        <option value="New Payee Check">New Payee Check</option>
                        <option value="Daily Limit">Daily Limit</option>
                    </select>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <label for="rule-severity-filter" class="form-label">Severity</label>
                    <select id="rule-severity-filter" class="form-select">
                        <option value="ALL">All Severities</option>
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>
                <div class="col-12 col-md-6 col-lg-2">
                    <label for="rule-status-filter" class="form-label">Status</label>
                    <select id="rule-status-filter" class="form-select">
                        <option value="ALL">All Status</option>
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <div class="col-12 col-lg-1 d-grid">
                    <button id="reset-rule-filters" type="button" class="btn btn-outline-secondary">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Rule ID</th>
                            <th>Rule Name</th>
                            <th>Rule Type</th>
                            <th>Threshold / Limit</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Alerts Generated</th>
                            <th>Last Updated</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rules-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ruleModal" tabindex="-1" aria-labelledby="ruleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ruleModalLabel">Add Rule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="rule-form">
                    <div class="modal-body">
                        <input type="hidden" id="rule-id-field">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="rule-name-field" class="form-label">Rule Name</label>
                                <input id="rule-name-field" type="text" class="form-control" required maxlength="80">
                            </div>
                            <div class="col-md-6">
                                <label for="rule-type-field" class="form-label">Rule Type</label>
                                <select id="rule-type-field" class="form-select" required>
                                    <option value="">Select type...</option>
                                    <option value="Amount Threshold">Amount Threshold</option>
                                    <option value="Velocity Rule">Velocity Rule</option>
                                    <option value="New Payee Check">New Payee Check</option>
                                    <option value="Daily Limit">Daily Limit</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="rule-severity-field" class="form-label">Severity</label>
                                <select id="rule-severity-field" class="form-select" required>
                                    <option value="LOW">LOW</option>
                                    <option value="MEDIUM">MEDIUM</option>
                                    <option value="HIGH">HIGH</option>
                                    <option value="CRITICAL">CRITICAL</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="rule-status-field" class="form-label">Status</label>
                                <select id="rule-status-field" class="form-select" required>
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                </select>
                            </div>
                            <div id="rule-type-dynamic-fields" class="col-12"></div>
                            <div class="col-12">
                                <label for="rule-description-field" class="form-label">Description</label>
                                <textarea id="rule-description-field" class="form-control" rows="3" maxlength="500" placeholder="Optional context for operators..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button id="save-rule-btn" type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ruleViewModal" tabindex="-1" aria-labelledby="ruleViewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ruleViewModalLabel">Rule Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="rule-view-content" class="rules-view-grid"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</section>
